# =============================================================================
# 行业基准与业务规则参数
# =============================================================================
# ⚠️ 重要：下面的数值是【行业量级的占位参考值】，不是任何真实媒体的报价。
#    接入真实数据后请用公司内部的真实 CPRP / 收视基准替换，替换后把 verified 改成 true。
#    工具在页面上会显示"当前使用未校准基准"的警告，直到你改为 true。
# =============================================================================

verified: false
last_updated: "2026-08-21"
source_note: "占位基准，待用公司内部 CSM/尼尔森数据校准"

# -----------------------------------------------------------------------------
# 目标人群基数（万人）—— 计算 曝光人次 = GRP/100 × universe 时用
# -----------------------------------------------------------------------------
universe:
  全国4+: 130000        # 全国4岁以上人口，万人
  全国15-44: 52000
  全国25-54: 58000
  一线城市25-45: 4200
  省网全省4+: 6000

default_universe: 全国4+

# -----------------------------------------------------------------------------
# 有效频次设定（Effective Frequency）
# 用于计算"有效到达率"——真正记住广告的人，而不是只被扫到一次的人
# -----------------------------------------------------------------------------
effective_frequency:
  新品上市: 5           # 新品认知门槛高，需要更高频次
  常规维护: 3           # 行业最常用的默认值（3+ 有效到达）
  促销冲刺: 2           # 短平快，靠广度不靠深度
  品牌提醒: 2
default_ef: 3

# -----------------------------------------------------------------------------
# 到达率模型参数
# rho（内部重复系数）：0 = 每次播出触达完全随机的人；1 = 每次都是同一批人
#   越大代表频道观众越"忠诚"、重复越高、净到达率涨得越慢
#   电视行业经验区间 0.10 ~ 0.35
# -----------------------------------------------------------------------------
reach_model:
  default_rho: 0.20
  rho_by_channel_type:
    央视: 0.16          # 覆盖广、观众杂，重复度相对低
    一线卫视: 0.22
    二线卫视: 0.26
    地面频道: 0.32      # 观众高度固定，重复度高
    OTT/智能电视: 0.18
  # 跨媒体合并到达率的方法：sainsbury（随机重复）| max（保守取最大值）
  cross_media_method: sainsbury

# -----------------------------------------------------------------------------
# 频道基准（占位值，务必替换）
# cprp: 每个收视点的成本（元）
# avg_rating: 该频道单次广告的平均收视率（%）
# max_reach: 该频道能触达的人口上限（%），到达率曲线的天花板
# channel_type: 用于取 rho
# -----------------------------------------------------------------------------
channels:
  CCTV-1:      {cprp: 42000, avg_rating: 0.85, max_reach: 62, channel_type: 央视}
  CCTV-3:      {cprp: 30000, avg_rating: 0.52, max_reach: 48, channel_type: 央视}
  CCTV-5:      {cprp: 33000, avg_rating: 0.48, max_reach: 45, channel_type: 央视}
  CCTV-6:      {cprp: 26000, avg_rating: 0.45, max_reach: 44, channel_type: 央视}
  CCTV-8:      {cprp: 28000, avg_rating: 0.58, max_reach: 46, channel_type: 央视}
  湖南卫视:    {cprp: 38000, avg_rating: 0.72, max_reach: 52, channel_type: 一线卫视}
  浙江卫视:    {cprp: 32000, avg_rating: 0.55, max_reach: 47, channel_type: 一线卫视}
  江苏卫视:    {cprp: 31000, avg_rating: 0.53, max_reach: 46, channel_type: 一线卫视}
  东方卫视:    {cprp: 27000, avg_rating: 0.42, max_reach: 41, channel_type: 一线卫视}
  北京卫视:    {cprp: 25000, avg_rating: 0.40, max_reach: 39, channel_type: 一线卫视}
  安徽卫视:    {cprp: 18000, avg_rating: 0.28, max_reach: 32, channel_type: 二线卫视}
  山东卫视:    {cprp: 17000, avg_rating: 0.26, max_reach: 31, channel_type: 二线卫视}
  广东卫视:    {cprp: 16000, avg_rating: 0.24, max_reach: 29, channel_type: 二线卫视}
  河南卫视:    {cprp: 14000, avg_rating: 0.22, max_reach: 27, channel_type: 二线卫视}
  OTT开机屏:   {cprp: 22000, avg_rating: 0.35, max_reach: 55, channel_type: OTT/智能电视}
  OTT贴片:     {cprp: 19000, avg_rating: 0.30, max_reach: 50, channel_type: OTT/智能电视}

# -----------------------------------------------------------------------------
# 数据质量检查阈值
# -----------------------------------------------------------------------------
quality:
  rating_max: 15.0            # 单次收视率超过这个值几乎一定是数据错误（单位搞错）
  discount_min: 0.01          # 折扣低于 1 折 → 可疑
  discount_max: 1.0           # 折扣不能大于 1（大于 1 通常是填成了百分数 30 而不是 0.3）
  cost_consistency_tol: 0.02  # 花费 vs 刊例×折扣 允许 2% 误差（尾差/税）
  grp_consistency_tol: 0.05   # GRP vs 收视率×次数 允许 5% 误差
  outlier_z: 3.0              # Z-score 超过 3 判为异常值
  mom_jump_pct: 0.5           # 环比波动超过 50% 提示复核
  duration_valid: [5, 10, 15, 20, 30, 45, 60]   # 常见广告时长（秒）

# -----------------------------------------------------------------------------
# KPI 达成判定档位（用于日周月报自动打标）
# -----------------------------------------------------------------------------
kpi_grading:
  达标: 1.00        # 完成率 >= 100%
  基本达标: 0.95    # >= 95%
  预警: 0.85        # >= 85%
  # 低于 85% → 未达标

# -----------------------------------------------------------------------------
# 竞品分析：ESOV 增长法则参数（Binet & Field）
# 经验规律：ESOV(超额声量) = SOV - SOM，每 10 个点 ESOV 约带来 0.5 个点份额增长
# -----------------------------------------------------------------------------
esov:
  growth_per_10pt_esov: 0.5
